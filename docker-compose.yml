services:
  postgres:
    image: postgres:16-alpine
    container_name: identity-link-postgres
    environment:
      POSTGRES_USER: identity_link
      POSTGRES_PASSWORD: identity_link
      POSTGRES_DB: identity_link
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - identity_link_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_link -d identity_link"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  identity_link_pgdata:
